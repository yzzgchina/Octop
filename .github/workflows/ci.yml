name: CI

# Pull requests only. GitHub runs PR checks on the merge result, so a push
# build on main would re-test content that the release / feature PR already
# proved green.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    # Post-release main → develop sync PRs carry main's already-tested tree and
    # are auto-merged by the bot before checks finish. See sync-main-to-develop.
    if: ${{ !startsWith(github.head_ref, 'chore/sync-develop-after-') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    # `@requires_postgresql` tests (tests/support/postgresql.py) are gated on
    # OCTOP_TEST_DATABASE_URL and are only exercised in the serial
    # "Test (PostgreSQL)" step below, which points at this throwaway service.
    # The plain `make test` step deliberately leaves the env var unset, so it
    # keeps skipping them: tests/integration/test_postgresql_control_plane.py
    # calls `DROP SCHEMA public CASCADE`, which races other xdist workers
    # sharing one database (psycopg UniqueViolation / DATABASE_NOT_EMPTY).
    # Credentials are container-local and never point at a real database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: octop_test
        ports:
          - 15432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # Frontend legs of `make all`, spelled out as explicit steps rather than one
      # `make all` call: that target starts with `format-all`, which rewrites the
      # tree (`ruff check --fix`, `prettier --write`) and would turn CI's two
      # format *checks* (`make lint`, `make lint-frontend`) into no-ops.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: make install

      # `make install` syncs Python deps only; the dashboard toolchain needs npm.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: dashboard

      - name: Lint
        run: make lint

      - name: Lint frontend
        run: make lint-frontend

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test

      - name: Test frontend
        run: make test-frontend

      # Unlike `make test` (xdist, SQLite only), this step runs the PG-gated
      # cases for real — previously they were skipped in every CI run. It is
      # serial (`-n0`) because these tests share one database and
      # `_reset_public_schema` drops `public`; running them in parallel raises
      # psycopg UniqueViolation on concurrent DDL and DATABASE_NOT_EMPTY.
      - name: Test (PostgreSQL)
        env:
          OCTOP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:15432/octop_test
        run: uv run pytest tests/integration/test_postgresql_control_plane.py tests/integration/test_postgresql_checkpoint_history.py -n0 -q

  test-windows:
    name: Windows / Python 3.12
    runs-on: windows-latest
    if: ${{ !startsWith(github.head_ref, 'chore/sync-develop-after-') }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      # Frontend legs of `make all` (see the `quality` job for why not `make all`
      # itself: its leading `format-all` would make CI's format checks no-ops).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: make install

      # `make install` syncs Python deps only; the dashboard toolchain needs npm.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: dashboard

      - name: Lint
        run: make lint

      - name: Lint frontend
        run: make lint-frontend

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test

      - name: Test frontend
        run: make test-frontend

  live-tests:
    name: "Live tests (real credentials)"
    runs-on: ubuntu-latest
    # Only the main repo may access secrets; fork PRs get none and must skip.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'chore/sync-develop-after-')
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      # Secrets are injected as env vars. Missing secrets => empty values =>
      # the live tests auto-skip (CI stays green). Never `echo`/print secrets.
      - name: Run live tests
        env:
          OPENAI_API_KEY: ${{ secrets.LIVE_OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.LIVE_OPENAI_BASE_URL }}
          OPENAI_MODEL_NAME: ${{ secrets.LIVE_OPENAI_MODEL_NAME }}
          OSS_KIND: ${{ secrets.LIVE_OSS_KIND }}
          OSS_ENDPOINT: ${{ secrets.LIVE_OSS_ENDPOINT }}
          OSS_ACCESS_KEY: ${{ secrets.LIVE_OSS_ACCESS_KEY }}
          OSS_SECRET_KEY: ${{ secrets.LIVE_OSS_SECRET_KEY }}
          OSS_BUCKET: ${{ secrets.LIVE_OSS_BUCKET }}
          OSS_REGION: ${{ secrets.LIVE_OSS_REGION }}
          OSS_PREFIX: ${{ secrets.LIVE_OSS_PREFIX }}
          ALI_OSS_KIND: ${{ secrets.LIVE_ALI_OSS_KIND }}
          ALI_OSS_ENDPOINT: ${{ secrets.LIVE_ALI_OSS_ENDPOINT }}
          ALI_OSS_ACCESS_KEY: ${{ secrets.LIVE_ALI_OSS_ACCESS_KEY }}
          ALI_OSS_SECRET_KEY: ${{ secrets.LIVE_ALI_OSS_SECRET_KEY }}
          ALI_OSS_BUCKET: ${{ secrets.LIVE_ALI_OSS_BUCKET }}
          ALI_OSS_REGION: ${{ secrets.LIVE_ALI_OSS_REGION }}
          ALI_OSS_PREFIX: ${{ secrets.LIVE_ALI_OSS_PREFIX }}
          CONNECTOR_TENCENT_DOCS_TOKEN: ${{ secrets.LIVE_CONNECTOR_TENCENT_DOCS_TOKEN }}
          CONNECTOR_TENCENT_MEETING_TOKEN: ${{ secrets.LIVE_CONNECTOR_TENCENT_MEETING_TOKEN }}
          CONNECTOR_TENCENT_WEIYUN_TOKEN: ${{ secrets.LIVE_CONNECTOR_TENCENT_WEIYUN_TOKEN }}
          CONNECTOR_YOUDAO_NOTE_TOKEN: ${{ secrets.LIVE_CONNECTOR_YOUDAO_NOTE_TOKEN }}
          CONNECTOR_TENCENT_NEWS_TOKEN: ${{ secrets.LIVE_CONNECTOR_TENCENT_NEWS_TOKEN }}
          CONNECTOR_WECHAT_READING_TOKEN: ${{ secrets.LIVE_CONNECTOR_WECHAT_READING_TOKEN }}
          CONNECTOR_QQ_MUSIC_TOKEN: ${{ secrets.LIVE_CONNECTOR_QQ_MUSIC_TOKEN }}
          CONNECTOR_FLIGGY_TOKEN: ${{ secrets.LIVE_CONNECTOR_FLIGGY_TOKEN }}
          CONNECTOR_BAIDU_MAP_TOKEN: ${{ secrets.LIVE_CONNECTOR_BAIDU_MAP_TOKEN }}
          CONNECTOR_CTRIP_WENDAO_TOKEN: ${{ secrets.LIVE_CONNECTOR_CTRIP_WENDAO_TOKEN }}
          CONNECTOR_TENCENT_IMA_TOKEN: ${{ secrets.LIVE_CONNECTOR_TENCENT_IMA_TOKEN }}
          CONNECTOR_TENCENT_IMA_CLIENT_ID: ${{ secrets.LIVE_CONNECTOR_TENCENT_IMA_CLIENT_ID }}
          CONNECTOR_TENCENT_LEXIANG_TOKEN: ${{ secrets.LIVE_CONNECTOR_TENCENT_LEXIANG_TOKEN }}
          CONNECTOR_TENCENT_LEXIANG_COMPANY_FROM: ${{ secrets.LIVE_CONNECTOR_TENCENT_LEXIANG_COMPANY_FROM }}
          CONNECTOR_MEITUAN_TRAVEL_TOKEN: ${{ secrets.LIVE_CONNECTOR_MEITUAN_TRAVEL_TOKEN }}
          CONNECTOR_YUANDIAN_TOKEN: ${{ secrets.LIVE_CONNECTOR_YUANDIAN_TOKEN }}
          # Channel probes (WeChat iLink + Feishu)
          WEIXIN_BOT_UIN: ${{ secrets.LIVE_WEIXIN_BOT_UIN }}
          WEIXIN_TOKEN: ${{ secrets.LIVE_WEIXIN_TOKEN }}
          WEIXIN_BASE_URL: ${{ secrets.LIVE_WEIXIN_BASE_URL }}
          FEISHU_APP_ID: ${{ secrets.LIVE_FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.LIVE_FEISHU_APP_SECRET }}
        run: make test-live
